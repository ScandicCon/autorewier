services:
  api:
    environment:
      WEB_BASE_URL: https://${APP_DOMAIN}
      OPENROUTER_SITE_URL: https://${APP_DOMAIN}
      YOOKASSA_RETURN_URL: https://${APP_DOMAIN}/cabinet/subscription?paid=1

  caddy:
    image: caddy:2.8
    container_name: autorewier-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
