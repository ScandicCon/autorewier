{% extends "base.html" %}
{% block title %}Вход — AutoRewier{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card auth-animate">

    <!-- Логотип внутри карточки -->
    <div style="margin-bottom:2rem;text-align:center">
      <a href="/" class="logo" style="justify-content:center">
        <span class="logo-mark" aria-hidden="true">AR</span>
        AutoRewier
      </a>
    </div>

    <h1>Добро пожаловать</h1>
    <p class="auth-sub">Войдите, чтобы продолжить работу с проверками</p>

    <!-- Ошибка -->
    {% if error %}
    <div class="alert alert-error" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/cabinet/login" novalidate>

      <!-- Email -->
      <div class="form-field">
        <input
          type="email"
          name="email"
          id="login-email"
          placeholder=" "
          required
          autocomplete="email"
          value="{{ form_email or '' }}"
        >
        <label for="login-email">Email</label>
      </div>

      <!-- Пароль -->
      <div class="form-field" style="margin-bottom:0.75rem">
        <input
          type="password"
          name="password"
          id="login-password"
          placeholder=" "
          required
          minlength="6"
          autocomplete="current-password"
        >
        <label for="login-password">Пароль</label>
      </div>

      <!-- Забыли пароль -->
      <div style="text-align:right;margin-bottom:1.5rem">
        <a href="/cabinet/forgot-password" style="font-size:0.88rem;color:var(--muted);text-decoration:none;transition:color 0.18s" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">Забыли пароль?</a>
      </div>

      <div class="auth-actions">
        <button type="submit" class="btn" style="width:100%;justify-content:center">
          Войти
        </button>
      </div>

    </form>

    <div class="auth-divider">или</div>

    <div class="auth-links">
      Нет аккаунта? <a href="/cabinet/register">Зарегистрироваться</a>
    </div>

  </div>
</div>
{% endblock %}
