services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autorewier-api
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:-change-me}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      RUN_ALEMBIC_ON_STARTUP: "false"
      ENABLE_SERVER_RENDERED_WEB: "false"
    command: ["python", "run_api.py"]
    volumes:
      - ./data:/app/data
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autorewier-bot
    env_file:
      - .env
    environment:
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:-change-me}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    command: ["python", "run_bot.py"]
    volumes:
      - ./data:/app/data
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
