name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      # Изолированное окружение: без внешних вызовов и боевых секретов.
      ENVIRONMENT: test
      ALLOW_MOCK_SERVICES: "true"
      STRICT_PRODUCTION_CHECKS: "false"
      RATE_LIMIT_ENABLED: "false"
      DATABASE_URL: "sqlite+aiosqlite:///./ci_test.db"
      WEB_SECRET_KEY: "ci-test-secret-key-not-for-production-0000000000000000"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run tests
        # Таймаут на тест: сетевой/зависший тест падает, а не блокирует пайплайн.
        run: pytest -q --timeout=120 --timeout-method=thread -m "not integration"

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
