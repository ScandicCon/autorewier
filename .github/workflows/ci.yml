name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      # Изолированное окружение: без внешних вызовов и боевых секретов.
      ENVIRONMENT: test
      ALLOW_MOCK_SERVICES: "true"
      STRICT_PRODUCTION_CHECKS: "false"
      RATE_LIMIT_ENABLED: "false"
      DATABASE_URL: "sqlite+aiosqlite:///./ci_test.db"
      WEB_SECRET_KEY: "ci-test-secret-key-not-for-production-0000000000000000"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-timeout — таймауты; pdfplumber — тест-only зависимость
          # (чтение сгенерированного PDF в tests/test_pdf_report.py), в прод не нужна.
          pip install pytest pytest-timeout pdfplumber

      - name: Run tests
        # Каждый тест-файл — в отдельном процессе. Это исключает кумулятивное
        # накопление ресурсов за один прогон (портальные потоки TestClient и т.п.),
        # из-за которого полный сьют одним процессом подвисал. См. docs/ERRORS_LOG.md (T-01).
        # Таймаут на тест: зависший/сетевой тест падает, а не блокирует пайплайн.
        run: |
          # GitHub Actions выполняет run-блок с bash -e (errexit). Без set +e
          # ненулевой код отдельного файла (например rc=5 «нет тестов» у integration-only
          # файла) прервал бы весь шаг ДО проверки rc. Отключаем errexit и обрабатываем
          # коды возврата вручную ниже.
          set +e
          fail=0
          for f in tests/test_*.py; do
            echo "::group::$f"
            # Жёсткий backstop: если pytest-таймаут не прервёт зависший тест,
            # shell-таймаут гарантированно убьёт процесс файла.
            timeout -s KILL 300 pytest "$f" -q --timeout=120 --timeout-method=thread -m "not integration"
            rc=$?
            echo "::endgroup::"
            # rc=5 — в файле нет неинтеграционных тестов (всё помечено integration), это норма.
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then
              echo "FAILED: $f (exit $rc)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All test files passed."

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
