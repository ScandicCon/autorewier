[pytest]
# Корень репозитория в sys.path, чтобы `import app` работал при запуске через
# консольный скрипт `pytest` (в CI), а не только через `python -m pytest`.
# Без этого все тесты падали с ModuleNotFoundError: No module named 'app'.
pythonpath = .
testpaths = tests
norecursedirs = data .venv node_modules frontend/dist
markers =
    integration: тесты, которым нужны внешние ресурсы (браузер/сеть); пропускаются в быстром CI
