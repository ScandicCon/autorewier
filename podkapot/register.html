<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация — ПОДКАПОТ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="gridbg"></div><div class="scan"></div>

<main class="auth">
  <div class="auth-art">
    <img src="img/register.png" alt="Сборка двигателя и чеклист">
    <div class="art-cap"><b>Собери свой гараж</b>Проверки, отчёты и чеклисты в одном месте</div>
  </div>

  <section class="auth-side">
    <a class="auth-back" href="login.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      К входу
    </a>

    <div class="auth-card" data-reveal>
      <div class="auth-badge"><span class="led"></span> РЕГИСТРАЦИЯ</div>
      <h1>Создать аккаунт</h1>
      <p class="sub">Пара полей — и можно проверять первое авто.</p>

      <form onsubmit="event.preventDefault();window.location.href='cabinet.html'">
        <div class="role-pick">
          <label class="role-opt sel" onclick="pickRole(this)"><input type="radio" name="role" checked><b>Покупатель</b><span>Беру авто для себя</span></label>
          <label class="role-opt" onclick="pickRole(this)"><input type="radio" name="role"><b>Перекуп</b><span>Оцениваю сделки</span></label>
        </div>
        <div class="form-field">
          <label>Как тебя зовут</label>
          <input type="text" placeholder="Имя" required>
        </div>
        <div class="form-field">
          <label>Телефон или e-mail</label>
          <input type="text" placeholder="+7 999 123-45-67 или mail@example.com" required>
        </div>
        <div class="form-field">
          <label>Пароль</label>
          <input type="password" placeholder="Минимум 8 символов" required>
        </div>
        <label class="consent"><input type="checkbox" required> Соглашаюсь с <a href="#">условиями</a> и <a href="#">политикой конфиденциальности</a></label>
        <button type="submit" class="btn btn-primary">Создать аккаунт</button>
      </form>

      <div class="divider">или зарегистрируйтесь через</div>

      <div class="social-row">
        <a class="social-btn" href="cabinet.html">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.6l6.3 5.2C41.2 36.2 44 30.6 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
          Google
        </a>
        <a class="social-btn" href="cabinet.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#29A9EA"/><path fill="#fff" d="M5.6 11.7l11-4.2c.5-.2 1 .1.8.9l-1.9 8.9c-.1.6-.5.7-1 .4l-2.7-2-1.3 1.3c-.2.2-.3.2-.5.2l.2-2.7 4.9-4.4c.2-.2 0-.3-.3-.1L8.4 13.5l-2.6-.8c-.6-.2-.6-.7.2-1z"/></svg>
          Telegram
        </a>
        <a class="social-btn" href="cabinet.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0077FF"/><path fill="#fff" d="M12.9 16.6c-4.6 0-7.4-3.2-7.5-8.5h2.3c.1 3.9 1.8 5.5 3.2 5.8V8.1h2.2v3.4c1.3-.1 2.7-1.6 3.2-3.4h2.2c-.4 2.1-1.8 3.6-2.8 4.2 1 .5 2.7 1.8 3.3 4.3h-2.4c-.5-1.6-1.8-2.9-3.5-3v3z"/></svg>
          VK
        </a>
        <a class="social-btn" href="cabinet.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#FC3F1D"/><path fill="#fff" d="M13.3 6.6h-1.2c-1.9 0-3.1 1-3.1 2.7 0 1.4.6 2.1 2 3l1 .6-2.9 4.5H10l2.6-3.9-.9-.6V18h1.6V6.6z"/></svg>
          Яндекс
        </a>
      </div>

      <div class="auth-foot">Уже есть аккаунт? <a href="login.html">Войти</a></div>
    </div>
  </section>
</main>

<script>function pickRole(el){document.querySelectorAll('.role-opt').forEach(r=>r.classList.remove('sel'));el.classList.add('sel');el.querySelector('input').checked=true;}</script>
<script src="app.js"></script>
</body>
</html>
